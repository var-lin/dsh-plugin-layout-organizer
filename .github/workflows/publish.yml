# 发布自动化：推送 v* tag 时自动构建、测试、发布到 npm 并创建同名 GitHub Release。
# 认证方式：npm Trusted Publishing（OIDC），无需任何 npm token。
# 一次性配套配置（npmjs.com 网页操作）：
#   包 dsh-plugin-layout-organizer → Settings → Trusted Publisher → GitHub Actions
#   Owner: var-lin
#   Repository: dsh-plugin-layout-organizer
#   Workflow filename: publish.yml
# 日常发版流程：改 version + CHANGELOG → 提交 → git tag vX.Y.Z → git push origin vX.Y.Z
# 发布与建 Release 都幂等：版本已存在则跳过，Release 已存在则改写说明，可安全重跑。
name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # 创建 / 更新 GitHub Release 需要写权限
  id-token: write # OIDC 令牌签发所必需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # tag 与 package.json 版本号必须一致，防止发错版本
      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "const v=require('./package.json').version; const t='${{ github.ref_name }}'; if (t !== 'v' + v) { console.error('tag ' + t + ' 与 package.json v' + v + ' 不一致'); process.exit(1); }"
      - name: 构建
        run: npm run build
      - name: 语法检查 + 校验已提交的构建产物与源码一致
        run: |
          npm run check
          git diff --exit-code -- lib/client.js
      - name: 测试
        run: npm test
      # Trusted Publishing：npm CLI 检测 GitHub OIDC 环境自动完成认证
      - name: 发布到 npm（该版本已存在则跳过）
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "dsh-plugin-layout-organizer@$VERSION" version >/dev/null 2>&1; then
            echo "npm 上已有 $VERSION，跳过发布"
          else
            npm publish
          fi
      # Release 说明取自 CHANGELOG 对应段落；已存在则改写，保证重跑不会失败
      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          node tools/release-notes.mjs "$VERSION" > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
          fi
