# PR 校验：开 PR 或推送主分支时，跑一遍与发版完全相同的闸门——
# 构建、语法检查、已提交的构建产物与源码一致、五个测试、源码类型检查。
# 发布只发生在 publish.yml（推送 v* tag），本工作流不触碰 npm 与 Release。
name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

# 同一分支的新提交顶掉上一次还在跑的校验，失败的那次不必排队等完。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: 构建
        run: npm run build
      # 构建产物是提交进仓库的，源码改了却忘记重新构建会在这一步失败。
      - name: 语法检查 + 校验已提交的构建产物与源码一致
        run: |
          npm run check
          git diff --exit-code -- lib/client.js
      - name: 测试
        run: |
          node test/smoke.mjs
          node test/gestures.mjs
          node test/navigate.mjs
          node test/accept.mjs
      # 类型检查依旧零依赖：不写进 package.json、不产生锁文件。
      # 走仓库自己的入口（与本地同一条命令）；机器上没有 VS Code 时它内部按需下载 6.0.3，
      # 与下面注释里的版本一致，所以流水线与本地吃的是同一套诊断。
      - name: 类型检查
        run: node tools/ts-check.mjs
