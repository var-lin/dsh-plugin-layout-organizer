name: 功能请求
description: 希望新增功能或改进现有行为，请选择此项进行提交
title: "[功能请求] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本插件只改变按钮的**显示位置**，不改插件注册表、不卸载也不启停任何插件；请求里请说明你想让界面变成什么样即可，不必给实现方案。

  - type: checkboxes
    id: preflight
    attributes:
      label: 重要阅读
      options:
        - label: 我已升级到最新的 release 版本，这个功能确实还没有
          required: true
        - label: 我已在已有的 issues 中查询过，没有重复请求
          required: true

  - type: dropdown
    id: scope
    attributes:
      label: 涉及的位置（可多选）
      multiple: true
      options:
        - 左侧边栏·顶部
        - 左侧边栏·底部
        - 对话页·顶部标签
        - 对话页·输入框下方
        - 右侧边栏·开始页
        - 设置窗口·左侧导航
        - 「更多」菜单
        - 设置页 /「已收起的按钮」面板 / 悬浮启动器
        - 不涉及具体位置
    validations:
      required: true

  - type: textarea
    id: feature
    attributes:
      label: 功能描述
      description: 说清你希望加什么功能、界面应该变成什么样
      placeholder: 例如：希望所有位置的按钮能共享一个全局顺序……
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: 补充说明（可选）
      description: 界面截图、参考实现、相关 issue 链接
    validations:
      required: false
